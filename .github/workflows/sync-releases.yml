# 🔄 GeoIP Releases 自動同步工作流
# 
# 從上游 Loyalsoldier/geoip 下載最新 Releases 並發布到 Fork
# 
# 設置步驟：
# 1. 在 Settings → Actions → General 中啟用 Actions
# 2. 設置 Workflow permissions 為 "Read and write permissions"
# 3. 勾選 "Allow GitHub Actions to create and approve pull requests"

name: Sync Releases from Upstream

on:
  schedule:
    # 每天 UTC 01:00 執行
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制重新發布'
        required: false
        default: 'false'

env:
  UPSTREAM_REPO: Loyalsoldier/geoip

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get upstream latest release
        id: upstream
        run: |
          echo "Fetching upstream release info..."
          RELEASE_INFO=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest")
          TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Upstream latest: $TAG"
      
      - name: Check if release exists locally
        id: check
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          echo "Checking if release $TAG exists..."
          
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          
          if [ "$EXISTS" = "200" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Release $TAG already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Will create release $TAG"
          fi
      
      - name: Download upstream release assets
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          TAG="${{ steps.upstream.outputs.tag }}"
          
          echo "📥 Downloading release assets for $TAG..."
          
          # 獲取所有 assets
          ASSETS=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
            | jq -r '.assets[].browser_download_url')
          
          for url in $ASSETS; do
            filename=$(basename "$url")
            echo "  Downloading: $filename"
            curl -fSL "$url" -o "release-assets/$filename" || echo "Failed: $filename"
          done
          
          echo ""
          echo "Downloaded files:"
          ls -lh release-assets/
      
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }}
          body: |
            🔄 **自動同步自上游**
            
            - 來源: [${{ env.UPSTREAM_REPO }}](https://github.com/${{ env.UPSTREAM_REPO }})
            - 原始 Release: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.upstream.outputs.tag }}
            - 同步時間: ${{ github.event.repository.updated_at }}
            
            ---
            
            此 Release 由 GitHub Actions 自動從上游同步。
            
            **CDN 訪問:**
            ```
            https://cdn.jsdmirror.com/gh/${{ github.repository }}@release/Country.mmdb
            ```
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## 📊 Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | ${{ env.UPSTREAM_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.upstream.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Already Exists | ${{ steps.check.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Downloaded Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh release-assets/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
